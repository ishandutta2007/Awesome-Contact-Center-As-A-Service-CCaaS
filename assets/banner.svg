<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: url(#primaryGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }
      .badge-bg {
        fill: rgba(56, 189, 248, 0.12);
        stroke: rgba(56, 189, 248, 0.4);
        stroke-width: 1px;
      }

      /* Animated Dynamic Waves and Particles in Background */
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }

      .floating-bg-1 {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .floating-bg-2 {
        animation: floatReverse 10s ease-in-out infinite;
      }
      .pulsing-glow {
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .animated-flow {
        stroke-dasharray: 8 6;
        animation: dashMove 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Outer Border -->
  <rect width="1198" height="338" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Animated Background Elements (Always strictly in background, below z-index of text) -->
  <g class="pulsing-glow">
    <circle cx="150" cy="80" r="130" fill="#38bdf8" filter="url(#glow)" opacity="0.12" />
    <circle cx="1060" cy="240" r="160" fill="#818cf8" filter="url(#glow)" opacity="0.12" />
    <circle cx="920" cy="70" r="100" fill="#c084fc" filter="url(#glow)" opacity="0.09" />
  </g>

  <!-- Animated Network / CCaaS Routing Lines in Background -->
  <g opacity="0.35">
    <path class="animated-flow" d="M -50 280 C 250 310, 400 230, 650 270 S 950 320, 1250 250" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="animated-flow" d="M -50 70 C 300 120, 600 40, 850 90 S 1100 60, 1250 110" fill="none" stroke="#818cf8" stroke-width="1.8" />
    <path class="animated-flow" d="M 100 -20 C 350 140, 700 130, 1050 -10" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Floating Dynamic Shapes (Left & Right margins to frame center content) -->
  <g class="floating-bg-1" opacity="0.6">
    <g transform="translate(70, 130)">
      <circle cx="20" cy="20" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Telephony / Omnichannel Headset Icon -->
      <path d="M 12 24 A 10 10 0 0 1 28 24 M 8 20 A 4 4 0 0 1 12 24 V 26 A 4 4 0 0 1 8 22 Z M 28 20 A 4 4 0 0 1 32 24 V 26 A 4 4 0 0 1 28 22 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>
    <g transform="translate(100, 230)">
      <circle cx="15" cy="15" r="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="15" cy="15" r="5" fill="#818cf8" />
    </g>
  </g>

  <g class="floating-bg-2" opacity="0.6">
    <g transform="translate(1040, 90)">
      <circle cx="30" cy="30" r="32" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <!-- Message / Chat Bubble Icon -->
      <path d="M 20 25 C 20 20, 40 20, 40 25 C 40 30, 32 31, 28 35 L 24 35 L 25 31 C 21 29, 20 27, 20 25 Z" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g transform="translate(1070, 210)">
      <circle cx="15" cy="15" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M 10 15 L 15 20 L 22 11" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badges, Title, Subtitle (Guaranteed 100% Legibility & Visual Clarity) -->
  <g transform="translate(0, 0)">
    <!-- Top Tags / Category Pills -->
    <g transform="translate(600, 75)">
      <!-- Pill 1: CCaaS Ecosystem -->
      <g transform="translate(-250, 0)">
        <rect x="-10" y="-14" width="135" height="28" rx="14" class="badge-bg" />
        <text class="badge-text" text-anchor="middle" x="57" y="4">⚡ CCaaS ECOSYSTEM</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(-100, 0)">
        <rect x="-10" y="-14" width="125" height="28" rx="14" class="badge-bg" stroke="rgba(129, 140, 248, 0.4)" fill="rgba(129, 140, 248, 0.12)" />
        <text class="badge-text" style="fill: #818cf8" text-anchor="middle" x="52" y="4">💻 OPEN SOURCE</text>
      </g>
      <!-- Pill 3: SaaS Platforms -->
      <g transform="translate(40, 0)">
        <rect x="-10" y="-14" width="140" height="28" rx="14" class="badge-bg" stroke="rgba(192, 132, 252, 0.4)" fill="rgba(192, 132, 252, 0.12)" />
        <text class="badge-text" style="fill: #c084fc" text-anchor="middle" x="60" y="4">☁️ ENTERPRISE SAAS</text>
      </g>
      <!-- Pill 4: AI & Omnichannel -->
      <g transform="translate(195, 0)">
        <rect x="-10" y="-14" width="150" height="28" rx="14" class="badge-bg" stroke="rgba(56, 189, 248, 0.4)" fill="rgba(56, 189, 248, 0.12)" />
        <text class="badge-text" style="fill: #38bdf8" text-anchor="middle" x="65" y="4">🤖 AI &amp; OMNICHANNEL</text>
      </g>
    </g>

    <!-- Main Title (Clear Foreground, Centered) -->
    <text class="title-text" x="600" y="165" text-anchor="middle">
      Awesome Contact Center as a Service
    </text>

    <!-- Subtitle (Centered, High Contrast) -->
    <text class="subtitle-text" x="600" y="215" text-anchor="middle">
      The Curated CCaaS Landscape: Cloud Platforms, Open-Source Engines &amp; AI Routing
    </text>

    <!-- Bottom Features Highlights -->
    <g transform="translate(600, 270)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
        Telephony PBX • WebRTC • Intelligent IVR • Omnichannel Chat &amp; Voice • Agent Copilots • Analytics
      </text>
    </g>
  </g>
</svg>
